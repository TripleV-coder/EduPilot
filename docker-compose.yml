# ============================================================
# EduPilot — Stack complète (app + PostgreSQL + Redis)
# Usage dev/prod : docker compose up -d
# ============================================================

services:
  # -----------------------------------------------
  # Application Next.js
  # -----------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: edupilot-app
    restart: unless-stopped
    # L'arrêt propre dure jusqu'à 25 s (20 s de requêtes en cours + 5 s de
    # fermetures) ; Docker tue le conteneur après 10 s par défaut.
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # En production, POSTGRES_PASSWORD doit impérativement être défini via les secrets d'infra.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-edupilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edupilot}?schema=public"
      # Migrations appliquées au démarrage (entrypoint). Quand la RLS est en
      # place (audit M2), DATABASE_URL utilise le rôle non propriétaire
      # `edupilot_app`, qui n'a pas le droit de modifier le schéma : la
      # connexion propriétaire passe par cette variable.
      MIGRATE_DATABASE_URL: "${MIGRATE_DATABASE_URL:-postgresql://${POSTGRES_USER:-edupilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edupilot}?schema=public}"
      NODE_ENV: production
      # Processus serveur (1, N ou « max ») : un processus Node n'utilise qu'un
      # cœur. Au-delà de 1, REDIS_URL est obligatoire (limites partagées), ex. :
      #   REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      REDIS_URL: "${REDIS_URL:-}"
    volumes:
      # Fichiers téléversés (justificatifs, avatars, documents) : sans volume,
      # ils disparaissaient à chaque recréation du conteneur.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edupilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -----------------------------------------------
  # PostgreSQL 16
  # -----------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edupilot-postgres
    restart: unless-stopped
    ports:
      # Boucle locale seulement : une base scolaire n'a rien à écouter sur le
      # réseau de l'établissement. Port hôte 5433 par défaut, pour ne pas
      # entrer en conflit avec un PostgreSQL déjà installé sur la machine.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edupilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edupilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupilot} -d ${POSTGRES_DB:-edupilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------
  # Redis — Rate limiting multi-instance (optionnel)
  # -----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edupilot-redis
    restart: unless-stopped
    ports:
      # Boucle locale seulement.
      - "127.0.0.1:6379:6379"
    # En production, REDIS_PASSWORD doit être fourni par l'environnement sans valeur par défaut faible.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - edupilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  uploads_data:
  postgres_data:
  redis_data:

networks:
  edupilot-network:
    driver: bridge
