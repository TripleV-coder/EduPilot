name: CD — Build, Image, Deploy

# Délégation : ci.yml fait lint/tests/e2e/security.
# Ce pipeline construit l'image Docker, scanne l'image, et déploie après merge sur main.
#
# Trigger model:
#   - Auto: run après que le workflow "CI" se termine en succès (filtre branche main).
#     Plus de course condition: GitHub garantit que CI est terminé avant que CD démarre.
#   - Manuel: workflow_dispatch (staging ou production), utile pour rejouer un déploiement
#     ou cibler explicitement la production sur un tag.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Cible de déploiement"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NEXT_TELEMETRY_DISABLED: "1"
  # SHA à déployer: head_sha du run CI déclencheur (workflow_run) ou github.sha (workflow_dispatch)
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image (GHCR), provenance + SBOM attestation
  #    Conditions de démarrage:
  #      - workflow_run: CI conclu en "success"
  #      - workflow_dispatch: toujours
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          # En workflow_run, github.sha pointe sur le HEAD de la branche du workflow CD,
          # pas le commit déclencheur du CI. On force le SHA déployé.
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,value=${{ env.DEPLOY_SHA }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Scan published image (Trivy → SARIF)
  # ─────────────────────────────────────────────────────────────────────────
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.DEPLOY_SHA }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Lighthouse perf budget on preview / staging
  # ─────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [docker]
    if: >-
      ${{
        github.event_name == 'workflow_run' ||
        github.event.inputs.environment == 'staging'
      }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI (existing workflow keeps detailed config)
        run: npx --yes @lhci/cli autorun --upload.target=temporary-public-storage
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Deploy to staging (auto) — production needs manual approval
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [image-scan]
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
        github.event.inputs.environment == 'staging'
      }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Run database migrations (deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deploy image (placeholder — customise per target)
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.DEPLOY_SHA }} to STAGING"
          # Examples by target:
          #   Vercel:    vercel deploy --prod --token=$VERCEL_TOKEN
          #   Railway:   railway up --service edupilot
          #   K8s:       kubectl set image deploy/edupilot app=$IMAGE && kubectl rollout status
          #   Compose:   ssh staging "docker pull $IMAGE && docker compose up -d"
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}

      - name: Smoke test (health endpoint)
        run: |
          set -e
          URL="${{ vars.STAGING_URL }}/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [[ "$code" == "200" ]]; then
              echo "Health OK (200)"
              exit 0
            fi
            echo "Attempt $i: $code — retrying in 10s"
            sleep 10
          done
          echo "Health check failed"
          exit 1

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    # Production: déclenchement manuel uniquement (workflow_dispatch + environment=production).
    # Le push sur tag passe par CI puis CD via workflow_run; pour pousser en prod, lancer
    # ce workflow manuellement après vérification du staging.
    if: ${{ github.event.inputs.environment == 'production' }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy image
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.DEPLOY_SHA }} to PRODUCTION"
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - name: Smoke test
        run: |
          set -e
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [[ "$code" == "200" ]]; then
              echo "Health OK (200)"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Notify Sentry of release
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://sentry.io/api/0/organizations/${{ vars.SENTRY_ORG }}/releases/" \
            -d '{"version":"${{ env.DEPLOY_SHA }}","projects":["${{ vars.SENTRY_PROJECT }}"]}'
        continue-on-error: true
