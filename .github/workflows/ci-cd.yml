name: CD — Build, Image, Deploy

# Délégation : ci.yml fait lint/tests/e2e/security.
# Ce pipeline construit l'image Docker, scanne l'image, et déploie après merge sur main.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Cible de déploiement"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Wait for CI workflow on the same SHA (fail-fast if CI is red)
  # ─────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Quality Gate"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build & push Docker image (GHCR), provenance + SBOM attestation
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Scan published image (Trivy → SARIF)
  # ─────────────────────────────────────────────────────────────────────────
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Lighthouse perf budget on preview / staging
  # ─────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [docker]
    if: ${{ github.event_name == 'push' || github.event.inputs.environment == 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI (existing workflow keeps detailed config)
        run: npx --yes @lhci/cli autorun --upload.target=temporary-public-storage
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Deploy to staging (auto) — production needs manual approval
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [image-scan]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations (deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deploy image (placeholder — customise per target)
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} to STAGING"
          # Examples by target:
          #   Vercel:    vercel deploy --prod --token=$VERCEL_TOKEN
          #   Railway:   railway up --service edupilot
          #   K8s:       kubectl set image deploy/edupilot app=$IMAGE && kubectl rollout status
          #   Compose:   ssh staging "docker pull $IMAGE && docker compose up -d"
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}

      - name: Smoke test (health endpoint)
        run: |
          set -e
          URL="${{ vars.STAGING_URL }}/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [[ "$code" == "200" ]]; then
              echo "Health OK (200)"
              exit 0
            fi
            echo "Attempt $i: $code — retrying in 10s"
            sleep 10
          done
          echo "Health check failed"
          exit 1

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production' }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy image
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} to PRODUCTION"
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - name: Smoke test
        run: |
          set -e
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [[ "$code" == "200" ]]; then
              echo "Health OK (200)"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Notify Sentry of release
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://sentry.io/api/0/organizations/${{ vars.SENTRY_ORG }}/releases/" \
            -d '{"version":"${{ github.sha }}","projects":["${{ vars.SENTRY_PROJECT }}"]}'
        continue-on-error: true
