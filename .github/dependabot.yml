# Mises à jour regroupées : au plus UNE PR par écosystème et par mois.
# Les correctifs de sécurité (Dependabot security updates) restent
# immédiats : ils ne dépendent pas de ce calendrier.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Africa/Porto-Novo"
    open-pull-requests-limit: 2
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    groups:
      # Mineures et correctifs : une seule PR pour tout le projet.
      npm-mineures:
        update-types: ["minor", "patch"]
    ignore:
      # Versions majeures (TypeScript 6, ESLint 10…) : migration manuelle.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node : changement de version majeure décidé manuellement (.nvmrc, CI).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
